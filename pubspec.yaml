name: emulators
description: >-
  Console emulation for Palapa. Wraps libretro cores behind a Dart API: the
  native side is a thin host that pumps frames, audio and input, and the Dart
  side owns sessions, save states and the display styles.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
