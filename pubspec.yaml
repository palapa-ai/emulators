name: emulator
description: >-
  Console emulation for Flutter. Wraps libretro cores behind a Dart API, with
  save states, period display shaders and a seam for a language model.
version: 0.1.0

repository: https://github.com/palapa-ai/emulators
issue_tracker: https://github.com/palapa-ai/emulators/issues

topics:
  - emulator
  - libretro
  - games
  - ffi

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/vhs.frag
    - shaders/crt.frag

  plugin:
    platforms:
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
